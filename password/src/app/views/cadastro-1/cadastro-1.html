<main class="cadastro-container">
  <!-- Cabeçalho -->
  <header class="cadastro-header">
    <h1 class="cadastro-titulo">Registro</h1>
    <p class="cadastro-subtitulo">
      Já possui uma conta? 
      <a href="" class="cadastro-link">Entre aqui</a>
    </p>
  </header>

  <!-- Formulário -->
  <section class="cadastro-form-section">
    <form class="form-cadastro" [formGroup]="registerForm" (ngSubmit)="register()">
    
      <!-- Email -->
      <div class="form-group">
        <label>Endereço de e-mail</label>
        <input type="email"formControlName="email" placeholder="Digite seu email" required>
      </div>

      <!-- Senha -->
      <div class="form-group">
        <label>Senha</label>
        <input type="password" formControlName="password" placeholder="Digite sua senha" required>
      </div>

      <!-- Confirmar senha -->
      <div class="form-group">
        <label>Repita a senha</label>
        <input type="password" formControlName="confirmPassword" placeholder="Repita sua senha" required>
      </div>

      <!-- Ações -->
      <div class="form-actions">
        <button type="submit" class="btn-login">Registrar</button>
      </div>
    </form>
  </section>
</main>

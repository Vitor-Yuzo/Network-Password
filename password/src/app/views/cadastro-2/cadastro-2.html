<main class="cadastro-container">
  <!-- Cabeçalho da página -->
  <header class="cadastro-header">
    <h1 class="cadastro-titulo">Registro</h1>
    <p class="cadastro-subtitulo">Registre aqui sua nova senha</p>
  </header>

  <!-- Formulário de cadastro -->
  <section class="cadastro-form-section">
    <form class="form-cadastro">
      <!-- Campo nome da plataforma -->
      <div class="form-group">
        <label for="plataforma">Nome da Plataforma</label>
        <input
          type="text"
          id="plataforma"
          name="plataforma"
          placeholder="Ex: Netflix, Google..."
          required
        />
      </div>

      <!-- Campo senha original -->
      <div class="form-group">
        <label for="senha">Insira sua senha original</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          required
        />
      </div>

      <!-- Botões -->
      <div class="form-actions">
        <button type="submit" class="btn-login">Registrar nova senha</button>
        <a href="dashboard">
          <button type="button" class="btn-registrar">Voltar</button>
        </a>
      </div>
    </form>
  </section>
</main>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="./cadastro-2.scss">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  
  <title>Registro</title>
</head>
<body>
  <div class="cadastro-container">
    
    <!-- Título -->
    <h1 class="registro-titulo">Registro</h1>
    
    <!-- sub Titulo -->
    <p class="login-link">
      Registre aqui sua nova senha
    </p>
    
    <!-- Formulário -->
    <form class="form-cadastro">
      
      <!-- Nome completo -->
      <div class="form-group">
        <label for="nome">Nome da Plataforma</label>
        <input type="text" id="nome" name="nome" placeholder="Nome" required>
      </div>
      
      <!-- Senha -->
      <div class="form-group">
        <label for="senha">Insira sua senha original</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
      </div>
      
      <!-- Botão -->
      <button type="submit" class="btn-login">Registrar nova senha</button>

      <!-- Botão registro -->
      <button type="button" class="btn-registrar">Voltar</button>
    </form>
    
  </div>
</body>
</html>

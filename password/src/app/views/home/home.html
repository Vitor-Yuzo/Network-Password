<div class="login-container">

  <!-- Título -->
  <h1 class="login-titulo">
    <span>Password</span><br>
    <span>Network</span>
  </h1>

  <!-- Formulário -->
  <form class="form-login" (ngSubmit)="onClick(email.value, password.value)">

    <!-- Email -->
    <div class="form-group">
      <label for="email">E-mail</label>
      <input #email type="email" id="email" name="email" placeholder="Digite seu email" required>
    </div>

    <!-- Senha -->
    <div class="form-group">
      <label for="senha">Senha</label>
      <input #password type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
    </div>

    <!-- Botão login -->
    <a href="dashboard">
      <button type="submit" class="btn-login">Clique para logar</button>
    </a>

    <!-- Separador -->
    <div class="separator">
      <span>OR</span>
    </div>

    <!-- Botão registro -->
    <a href="cadastro">
      <button type="button" class="btn-registrar">Registrar-se</button>
    </a>
  </form>

</div>

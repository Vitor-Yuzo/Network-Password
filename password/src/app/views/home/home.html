<div class="login-container">

  <!-- Título -->
  <h1 class="login-titulo">
    <span>Password</span><br>
    <span>Network</span>
  </h1>

  <!-- Formulário -->
  <form class="form-login" [formGroup]="loginForm" (ngSubmit)="login()">
  <!-- Email -->
  <div class="form-group">
    <label for="email">E-mail</label>
    <input type="email"formControlName="email" placeholder="Digite seu email" required>
  </div>

  <!-- Senha -->
  <div class="form-group">
    <label for="senha">Senha</label>
    <input type="password" formControlName="password" placeholder="Digite sua senha" required>
  </div>

  <!-- Botão login -->
  <button type="submit" class="btn-login">Clique para logar</button>
</form>

    <div class="separator">
      <span>OR</span>
    </div>

    <!-- Botão registro -->
    <a href="cadastro">
      <button type="button" class="btn-registrar">Registrar-se</button>
    </a>

</div>
